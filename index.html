<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인터랙티브 단가 추출 도구 v6.2</title>
    <style>
        body { font-family: 'Malgun Gothic', dotum, sans-serif; margin: 20px; background-color: #f9f9f9; color: #333; }
        h1 { font-size: 24px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        h2 { font-size: 16px; margin-top: 20px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        h3 { font-size: 13px; color: #555; margin-top: 12px; margin-bottom: 6px; border-left: 3px solid #007bff; padding-left: 6px; }
        
        /* 컨트롤 섹션 */
        .btn-container { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .flex-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
        
        /* 버튼 스타일 */
        .btn { padding: 8px 14px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .btn:hover { background: #f0f0f0; }
        .btn.active { background: #007bff; color: #fff; border-color: #0056b3; }
        .btn.active .order-badge { background: rgba(255,255,255,0.3); color: #fff; }
        
        /* 공란 버튼 특화 스타일 */
        .btn-blank { background: #f8f9fa; border: 1px dashed #6c757d; font-weight: bold; color: #495057; }
        .btn-blank:hover { background: #e2e6ea; }
        
        .order-badge { display: inline-block; width: 18px; height: 18px; background: #eee; color: #666; border-radius: 50%; text-align: center; line-height: 18px; font-size: 11px; margin-left: 6px; font-weight: bold; }
        
        .btn-reset { padding: 4px 8px; font-size: 12px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-reset:hover { background: #bd2130; }
        
        /* 결과 및 복사 섹션 */
        .action-container { margin: 20px 0; display: flex; gap: 10px; }
        .btn-action { padding: 10px 20px; font-size: 15px; font-weight: bold; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-action:hover { background: #218838; }
        .btn-text { background: #17a2b8; }
        .btn-text:hover { background: #138496; }
        
        /* 미리보기 표 스타일 (열 너비 강제 고정 셋팅) */
        .table-responsive { overflow-x: auto; background: white; padding: 15px; border-radius: 6px; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; font-size: 10pt; table-layout: fixed; }
        th, td { border: 1px solid #cccccc; padding: 10px; text-align: center; vertical-align: top; word-break: break-all; word-wrap: break-word; }
        th { background-color: #f2f2f2; font-weight: bold; }
        
        /* 🌟 웹 화면 뷰 전용 열 너비 클래스 정의 */
        .col-standard { width: 90px; }      /* 크리에이터, 단가, 공란 고정 너비 */
        .col-description { width: 240px; }   /* 채널 소개 넓은 너비 */
        .col-license { width: 300px; }       /* 2차 활용 너비 */
        .align-left { text-align: left; white-space: pre-line; line-height: 1.5; }
        
        .table-footer-notice { margin-top: 12px; font-size: 10pt; color: #555; font-weight: bold; line-height: 1.5; }
        a { color: #007bff; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 4px; display: none; z-index: 1000; }

        /* 보안 잠금 화면 스타일 */
        #password-lock {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #f4f6f9; z-index: 9999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Malgun Gothic', dotum, sans-serif;
        }
        .lock-box {
            background: #ffffff; padding: 30px; border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center;
        }
        .lock-box h2 { font-size: 20px; margin-bottom: 20px; color: #333; justify-content: center; }
        .lock-box input {
            padding: 12px; font-size: 16px; border: 1px solid #ddd; 
            border-radius: 4px; width: 240px; margin-right: 8px; outline: none;
        }
        .lock-box input:focus { border-color: #007bff; }
        .lock-box button {
            padding: 12px 20px; font-size: 16px; background: #007bff; 
            color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .lock-box button:hover { background: #0056b3; }
        #pw-error { color: #dc3545; font-size: 14px; margin-top: 12px; display: none; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body style="display: none;">

    <div id="password-lock">
        <div class="lock-box">
            <h2>🔒 대외비 단가 확인 도구</h2>
            <div style="display: flex; justify-content: center; align-items: center;">
                <input type="password" id="pw-input" placeholder="비밀번호를 입력하세요">
                <button onclick="checkPassword()">확인</button>
            </div>
            <p id="pw-error">비밀번호가 올바르지 않습니다.</p>
        </div>
    </div>

    <h1>📊 단가 추출 테이블 빌더 (단가 수정 및 푸터 추가)</h1>

    <h2>
        <span>1. 내부 크리에이터 선택 (클릭 순서대로 반영, 공란은 다중 누적 가능)</span>
        <button class="btn-reset" onclick="resetSelection('internal')">초기화</button>
    </h2>
    <div class="btn-container">
        <button class="btn btn-blank" style="margin-bottom: 12px;" onclick="addBlankCreator()">➕ 공란 행 추가 <span class="order-badge" id="blank-creator-badge">0</span></button>
        <div id="internal-buttons" class="flex-wrap"></div>
    </div>

    <h2>
        <span>2. 외부 크리에이터 선택 (티투피 일괄 적용 ver. 유튜브 +300 / 인스타 +200)</span>
        <button class="btn-reset" onclick="resetSelection('external')">초기화</button>
    </h2>
    <div class="btn-container">
        <h3>🔥 솔로지옥 시리즈</h3>
        <div id="section-solojiok" class="flex-wrap" style="margin-bottom: 15px;"></div>

        <h3>💘 환승연애 시리즈</h3>
        <div id="section-transfer" class="flex-wrap" style="margin-bottom: 15px;"></div>

        <h3>💬 하트시그널 / 하트페어링</h3>
        <div id="section-heart" class="flex-wrap"></div>
    </div>

    <h2>
        <span>3. 항목 선택 (클릭 순서대로 열 배치, 공란은 다중 누적 가능)</span>
        <button class="btn-reset" onclick="resetSelection('items')">초기화</button>
    </h2>
    <div class="btn-container">
        <div id="item-buttons" class="flex-wrap"></div>
    </div>

    <div class="action-container">
        <button class="btn-action" onclick="copyToGmail()">📋 Gmail 붙여넣기용 복사 (HTML)</button>
        <button class="btn-action btn-text" onclick="copyToText()">📝 텍스트로 복사 (Tab 구분)</button>
    </div>

    <h2>실시간 미리보기</h2>
    <div class="table-responsive" id="table-output">
        <p style="color: #666; text-align: center; padding: 20px;">크리에이터와 항목을 선택하면 표가 생성됩니다.</p>
    </div>

    <div class="toast" id="toast">복사되었습니다!</div>

        let creatorsData = [];
        let externalData = [];

        document.addEventListener("DOMContentLoaded", () => {
            document.body.style.display = "block";
            document.getElementById('pw-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkPassword();
            });
            document.getElementById('pw-input').focus();
        });

        function checkPassword() {
            const inputPw = document.getElementById('pw-input').value;
            try {
                const key = CryptoJS.SHA256(inputPw);
                const iv = CryptoJS.enc.Utf8.parse("ticketcost_iv_16");
                
                const decrypted = CryptoJS.AES.decrypt(ENCRYPTED_DATA, key, {
                    iv: iv,
                    mode: CryptoJS.mode.CBC,
                    padding: CryptoJS.pad.Pkcs7
                });
                
                const decryptedText = decrypted.toString(CryptoJS.enc.Utf8);
                if (!decryptedText) throw new Error("Decryption failed");
                
                const data = JSON.parse(decryptedText);
                creatorsData = data.creatorsData;
                externalData = data.externalData;
                
                document.getElementById('password-lock').remove();
                init();
            } catch (e) {
                document.getElementById('pw-error').style.display = 'block';
                document.getElementById('pw-input').value = '';
                document.getElementById('pw-input').focus();
            }
        }

        const itemsConfig = [
            { label: "유튜브 브랜디드 콘텐츠", group: "youtube", key: "bdc" },
            { label: "유튜브 기획 PPL", group: "youtube", key: "planned_ppl" },
            { label: "유튜브 쇼츠", group: "youtube", key: "shorts" },
            { label: "인스타그램 릴스", group: "instagram", key: "reels" },
            { label: "인스타그램 사진", group: "instagram", key: "feed" },
            { label: "출연 단가", group: "direct", key: "appearance" },
            { label: "채널 소개", group: "direct", key: "description" },
            { label: "2차 활용", group: "direct", key: "license" }
        ];

        let selectedRows = []; 
        let selectedItems = [];
        let blankCreatorCounter = 0;
        let blankItemCounter = 0;

        const noticeText = "- 단위 : 만원 / 부가세 별도";

        function init() {
            const internalContainer = document.getElementById('internal-buttons');
            creatorsData.forEach((c, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn internal-btn';
                btn.innerHTML = `${c.creator}<span class="order-badge" id="c-badge-${idx}">-</span>`;
                btn.onclick = () => toggleRowSelection('internal', idx, btn);
                internalContainer.appendChild(btn);
            });

            externalData.forEach((c, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn external-btn';
                btn.innerHTML = `${c.creator}<span class="order-badge" id="ext-badge-${idx}">-</span>`;
                btn.onclick = () => toggleRowSelection('external', idx, btn);
                
                const targetSection = document.getElementById(`section-${c.show}`);
                if (targetSection) targetSection.appendChild(btn);
            });

            const itemContainer = document.getElementById('item-buttons');
            const blankItemBtn = document.createElement('button');
            blankItemBtn.className = 'btn btn-blank';
            blankItemBtn.innerHTML = `➕ 공란 열 추가 <span class="order-badge" id="blank-item-badge">0</span>`;
            blankItemBtn.onclick = () => addBlankItem();
            itemContainer.appendChild(blankItemBtn);

            itemsConfig.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn item-btn';
                btn.innerHTML = `${item.label}<span class="order-badge" id="i-badge-${idx}">-</span>`;
                btn.onclick = () => toggleItem(item, idx, btn);
                itemContainer.appendChild(btn);
            });
        }

        function toggleRowSelection(dbType, idx, btn) {
            const pos = selectedRows.findIndex(item => item.dbType === dbType && item.index === idx);
            if (pos > -1) {
                selectedRows.splice(pos, 1);
                btn.classList.remove('active');
            } else {
                selectedRows.push({ dbType: dbType, type: 'real', index: idx });
                btn.classList.add('active');
            }
            updateBadges('creators');
            renderTable();
        }

        function addBlankCreator() {
            blankCreatorCounter++;
            selectedRows.push({ dbType: 'blank', type: 'blank', id: blankCreatorCounter });
            updateBadges('creators');
            renderTable();
        }

        function toggleItem(item, idx, btn) {
            const pos = selectedItems.findIndex(target => target.type === 'real' && target.config.label === item.label);
            if (pos > -1) {
                selectedItems.splice(pos, 1);
                btn.classList.remove('active');
            } else {
                selectedItems.push({ type: 'real', config: item, index: idx });
                btn.classList.add('active');
            }
            updateBadges('items');
            renderTable();
        }

        function addBlankItem() {
            blankItemCounter++;
            selectedItems.push({ type: 'blank', id: blankItemCounter });
            updateBadges('items');
            renderTable();
        }

        function updateBadges(type) {
            if (type === 'creators') {
                creatorsData.forEach((_, idx) => {
                    const badge = document.getElementById(`c-badge-${idx}`);
                    if(badge) {
                        const pos = selectedRows.findIndex(item => item.dbType === 'internal' && item.index === idx);
                        badge.textContent = pos > -1 ? pos + 1 : '-';
                    }
                });
                externalData.forEach((_, idx) => {
                    const badge = document.getElementById(`ext-badge-${idx}`);
                    if(badge) {
                        const pos = selectedRows.findIndex(item => item.dbType === 'external' && item.index === idx);
                        badge.textContent = pos > -1 ? pos + 1 : '-';
                    }
                });
                const totalBlanks = selectedRows.filter(item => item.type === 'blank').length;
                document.getElementById('blank-creator-badge').textContent = totalBlanks;
            } else {
                itemsConfig.forEach((item, idx) => {
                    const badge = document.getElementById(`i-badge-${idx}`);
                    const pos = selectedItems.findIndex(target => target.type === 'real' && target.index === idx);
                    badge.textContent = pos > -1 ? pos + 1 : '-';
                });
                const totalBlanks = selectedItems.filter(item => item.type === 'blank').length;
                document.getElementById('blank-item-badge').textContent = totalBlanks;
            }
        }

        function resetSelection(type) {
            if (type === 'internal') {
                selectedRows = selectedRows.filter(item => item.dbType !== 'internal');
                document.querySelectorAll('.internal-btn').forEach(b => b.classList.remove('active'));
                updateBadges('creators');
            } else if (type === 'external') {
                selectedRows = selectedRows.filter(item => item.dbType !== 'external');
                document.querySelectorAll('.external-btn').forEach(b => b.classList.remove('active'));
                updateBadges('creators');
            } else if (type === 'items') {
                selectedItems = [];
                blankItemCounter = 0;
                document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('active'));
                updateBadges('items');
            }
            renderTable();
        }

        function getDynamicLink(creator, currentItems) {
            const hasYoutube = currentItems.some(i => i.type === 'real' && i.config.label.includes('유튜브'));
            const hasInsta = currentItems.some(i => i.type === 'real' && i.config.label.includes('인스타'));
            if (hasYoutube && !hasInsta) return creator.youtube_url || creator.instagram_url || "#";
            if (!hasYoutube && hasInsta) return creator.instagram_url || creator.youtube_url || "#";
            return creator.youtube_url || creator.instagram_url || "#";
        }

        function getValueFromData(creator, itemConfig) {
            let val = null;
            if (itemConfig.group === 'direct') {
                val = creator[itemConfig.key];
            } else {
                val = creator[itemConfig.group] ? creator[itemConfig.group][itemConfig.key] : null;
            }
            return val === null || val === undefined ? "-" : val;
        }

        function getDynamicNotices() {
            let notices = [];
            const hasBdc = selectedItems.some(i => i.type === 'real' && i.config.label === "유튜브 브랜디드 콘텐츠");
            const hasPpl = selectedItems.some(i => i.type === 'real' && i.config.label === "유튜브 기획 PPL");
            const hasReels = selectedItems.some(i => i.type === 'real' && i.config.label === "인스타그램 릴스");
            const hasFeed = selectedItems.some(i => i.type === 'real' && i.config.label === "인스타그램 사진");
            const hasHaeun = selectedRows.some(c => c.dbType === 'internal' && c.index === 0);

            if (hasBdc) notices.push("- 유튜브 브랜디드 콘텐츠 : 메인 제품 1개, 서브 제품 최대 2개 기준");
            if (hasPpl) notices.push("- 유튜브 기획 PPL : 제품 1개, 마케팅 포인트 2개 기준");
            if (hasReels) notices.push("- 인스타그램 릴스 : 30초 내외 / 해시태그 3개 / 사전 기획안 전달이 어려우며 앵글안만 공유드리고 있습니다. (상세 마케팅 포인트 언급이 없는 자연스러운 노출 위주 진행)");
            if (hasFeed) {
                if (hasHaeun) {
                    notices.push("- 인스타그램 사진 : 사진 4장(*성해은 3장) 개런티 / 해시태그 3개 / 브랜드 계정 태그 가능 / 착장 1벌 기준");
                } else {
                    notices.push("- 인스타그램 사진 : 사진 4장 개런티 / 해시태그 3개 / 브랜드 계정 태그 가능 / 착장 1벌 기준");
                }
            }
            return notices;
        }

        function generateTableHTML(isForEmail = false) {
            if (selectedRows.length === 0 || selectedItems.length === 0) {
                return `<p style="color: #666; text-align: center; padding: 20px;">크리에이터(행)와 항목(열)을 선택해 주세요.</p>`;
            }
            
            const tableStyle = isForEmail ? 'style="width:100%; border-collapse:collapse; font-size:10pt; font-family:\'Malgun Gothic\', sans-serif; table-layout:fixed;"' : '';
            const thStyle = isForEmail ? 'style="border:1px solid #cccccc; padding:10px; background-color:#f2f2f2; font-weight:bold; text-align:center; vertical-align:top; font-size:10pt; word-break:break-all;" width="110"' : 'class="col-standard"';
            const tdCenterStyle = isForEmail ? 'style="border:1px solid #cccccc; padding:10px; text-align:center; vertical-align:top; font-size:10pt; word-break:break-all;"' : '';
            const titleStyle = isForEmail ? 'style="font-size:10pt; font-weight:bold; font-family:\'Malgun Gothic\', sans-serif; margin-bottom:10px;"' : 'style="font-size:10pt; font-weight:bold; margin-bottom:10px;"';
            
            let html = `<div ${titleStyle}>[크리에이터 리스트]</div>`;
            html += `<table ${tableStyle}>`;
            
            // 🌟 헤더(제목 행) 고정 폭 인라인 및 클래스 주입
            html += `<thead><tr><th ${thStyle}>크리에이터</th>`;
            selectedItems.forEach(item => {
                let thWidthStyle = isForEmail ? ' width="110"' : ' class="col-standard"'; // 기본 단가 및 공란 열 (너비 고정)
                
                if (item.type === 'real') {
                    if (item.config.label === "채널 소개") {
                        thWidthStyle = isForEmail ? ' width="260"' : ' class="col-description"'; // 채널 소개 열 (넓게 고정)
                    } else if (item.config.label === "2차 활용") {
                        thWidthStyle = isForEmail ? ' width="320"' : ' class="col-license"';     // 2차 활용 열
                    }
                }
                const headText = item.type === 'blank' ? '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;' : item.config.label;
                html += `<th ${isForEmail ? 'style="border:1px solid #cccccc; padding:10px; background-color:#f2f2f2; font-weight:bold; text-align:center; vertical-align:top; font-size:10pt; word-break:break-all;"' : ''}${thWidthStyle}>${headText}</th>`;
            });
            html += `</tr></thead><tbody>`;

            selectedRows.forEach(rowTarget => {
                html += `<tr>`;
                if (rowTarget.type === 'blank') {
                    html += `<td ${tdCenterStyle}>&nbsp;</td>`;
                    selectedItems.forEach(item => {
                        const isLeftAlign = (item.type === 'real' && (item.config.label === "채널 소개" || item.config.label === "2차 활용"));
                        let tdStyle = tdCenterStyle;
                        if (isLeftAlign) {
                            const widthVal = item.config.label === "채널 소개" ? '260' : '320';
                            tdStyle = isForEmail ? `style="border:1px solid #cccccc; padding:10px; text-align:left; vertical-align:top; font-size:10pt;" width="${widthVal}"` : 'class="align-left"';
                        }
                        html += `<td ${tdStyle}>&nbsp;</td>`;
                    });
                } else {
                    const creator = rowTarget.dbType === 'internal' ? creatorsData[rowTarget.index] : externalData[rowTarget.index];
                    const link = getDynamicLink(creator, selectedItems);
                    const linkStyle = isForEmail ? 'style="color:#007bff; text-decoration:none; font-weight:bold; font-size:10pt;"' : '';
                    if (link !== "#") {
                        html += `<td ${tdCenterStyle}><a href="${link}" target="_blank" ${linkStyle}>${creator.creator}</a></td>`;
                    } else {
                        html += `<td ${tdCenterStyle}>${creator.creator}</td>`;
                    }
                    
                    selectedItems.forEach(colTarget => {
                        if (colTarget.type === 'blank') {
                            html += `<td ${tdCenterStyle}>&nbsp;</td>`;
                        } else {
                            const val = getValueFromData(creator, colTarget.config);
                            const isLeftAlign = (colTarget.config.label === "채널 소개" || colTarget.config.label === "2차 활용");
                            let tdStyle = tdCenterStyle;
                            let cellClass = '';
                            
                            if (isLeftAlign) {
                                const formattedVal = isForEmail ? val.replace(/\n/g, '<br>') : val;
                                const widthVal = colTarget.config.label === "채널 소개" ? '260' : '320';
                                const maxClass = colTarget.config.label === "채널 소개" ? 'col-description' : 'col-license';
                                
                                tdStyle = isForEmail 
                                    ? `style="border:1px solid #cccccc; padding:10px; text-align:left; vertical-align:top; white-space:pre-line; line-height:1.5; font-size:10pt; word-break:break-all;" width="${widthVal}"` 
                                    : '';
                                cellClass = isForEmail ? '' : `class="align-left ${maxClass}"`;
                                html += `<td ${tdStyle} ${cellClass}>${formattedVal}</td>`;
                            } else {
                                html += `<td ${tdStyle} ${cellClass}>${val}</td>`;
                            }
                        }
                    });
                }
                html += `</tr>`;
            });
            html += `</tbody></table>`;
            
            const footerStyle = isForEmail ? 'style="margin-top:12px; font-size:10pt; color:#555; font-weight:bold; font-family:\'Malgun Gothic\', sans-serif; line-height:1.5;"' : 'class="table-footer-notice"';
            html += `<div ${footerStyle}>${noticeText}`;
            const extraNotices = getDynamicNotices();
            if (extraNotices.length > 0) {
                html += `<br>` + extraNotices.join("<br>");
            }
            html += `</div>`;
            
            return html;
        }

        function renderTable() {
            const container = document.getElementById('table-output');
            container.innerHTML = generateTableHTML(false);
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        function copyToGmail() {
            if (selectedRows.length === 0 || selectedItems.length === 0) return alert('선택된 항목이 없습니다.');
            const htmlString = generateTableHTML(true);
            const blobHtml = new Blob([htmlString], { type: "text/html" });
            const blobText = new Blob([htmlString.replace(/<[^>]*>/g, '')], { type: "text/plain" });
            const data = [new ClipboardItem({ "text/html": blobHtml, "text/plain": blobText })];
            navigator.clipboard.write(data).then(() => { showToast(); }).catch(err => { alert('복사 실패: 다시 시도해주세요.'); });
        }

        function copyToText() {
            if (selectedRows.length === 0 || selectedItems.length === 0) return alert('선택된 항목이 없습니다.');
            let textResult = "[크리에이터 리스트]\n";
            let headerRow = ["크리에이터"];
            selectedItems.forEach(item => { headerRow.push(item.type === 'blank' ? "" : item.config.label); });
            textResult += headerRow.join("\t") + "\n";
            selectedRows.forEach(rowTarget => {
                let row = [];
                if (rowTarget.type === 'blank') {
                    row.push("");
                    selectedItems.forEach(() => row.push(""));
                } else {
                    const creator = rowTarget.dbType === 'internal' ? creatorsData[rowTarget.index] : externalData[rowTarget.index];
                    row.push(creator.creator);
                    selectedItems.forEach(colTarget => {
                        if (colTarget.type === 'blank') { row.push(""); } else {
                            let val = getValueFromData(creator, colTarget.config);
                            if (val.includes('\n')) { val = `"${val}"`; }
                            row.push(val);
                        }
                    });
                }
                textResult += row.join("\t") + "\n";
            });
            textResult += "\n" + noticeText;
            const extraNotices = getDynamicNotices();
            if (extraNotices.length > 0) { textResult += "\n" + extraNotices.join("\n"); }
            textResult += "\n";
            navigator.clipboard.writeText(textResult).then(() => { showToast(); });
        }


    </script>
</body>
</html>
